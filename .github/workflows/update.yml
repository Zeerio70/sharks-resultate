name: Resultate aktualisieren

on:
  schedule:
    # Zeiten in UTC: täglich am Morgen, an Spieltag-Wochenenden zusätzlich am Abend
    - cron: '17 5 * * *'
    - cron: '17 19 * * 0,6'
  workflow_dispatch: {}   # erlaubt manuelles Starten unter "Actions"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
